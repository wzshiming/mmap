# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi

    - name: Cross-platform vet
      # The default shell (bash -e) stops the loop at the first failing target.
      run: |
        for target in \
          linux/amd64 linux/386 linux/arm64 darwin/amd64 darwin/arm64 \
          windows/amd64 windows/386 windows/arm64 \
          freebsd/amd64 openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
          solaris/amd64 illumos/amd64 aix/ppc64 plan9/amd64 \
          js/wasm wasip1/wasm android/arm64; do
          echo "$target"
          GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
        done
